[project]
name = "stock-market-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scipy>=1.18.1",
    "streamlit>=1.65.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
